name: Test plugin
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '22.23.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install omnigent==0.16.0
      - run: npm test
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-node-${{ matrix.node }}
          path: '*.tgz'
          retention-days: 30
  native-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Prepare pinned Pi Web with native Omnigent tab
        run: |
          git clone https://github.com/agegr/pi-web.git /tmp/pi-web-omnigent
          git -C /tmp/pi-web-omnigent checkout --detach 6fcd7d44981ab51a21d6cd6eb06d361d0e3d3068
          git -C /tmp/pi-web-omnigent apply "$GITHUB_WORKSPACE/integrations/pi-web/adapter.patch"
      - run: npm ci --ignore-scripts --no-fund
        working-directory: /tmp/pi-web-omnigent
      - run: node --test lib/omnigent-runtime.test.mjs lib/settings-navigation.test.mjs app/api/omnigent/route.test.mjs components/SettingsPanel.test.mjs
        working-directory: /tmp/pi-web-omnigent
      - run: npx tsc --noEmit
        working-directory: /tmp/pi-web-omnigent
      - run: npm run build
        working-directory: /tmp/pi-web-omnigent
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CIRCLE_NODE_TOTAL: '3'
