name: Test plugin
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '22.23.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install omnigent==0.16.0
      - name: Node and Python tests on the runner
        shell: bash
        run: |
          tests=()
          for file in tests/*.test.mjs; do
            if [[ "$file" != tests/ui-installer.test.mjs ]]; then tests+=("$file"); fi
          done
          node --test "${tests[@]}"
          node bin/test-python.mjs
      - name: UI installer tests in an observable PID namespace
        # Retention deliberately refuses cleanup if any /proc/*/cwd is denied.
        # The runner has unrelated root processes; use a private PID namespace
        # with all test processes under one UID, without weakening that check.
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            "node:${{ matrix.node }}-bookworm" \
            node --test tests/ui-installer.test.mjs
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-node-${{ matrix.node }}
          path: '*.tgz'
          retention-days: 30
  server-contract:
    # The adapter (src/omnigent.py) against a real local Omnigent server instead of fakes:
    # connect, host online, resume (running and after the host died), identity mismatch,
    # disconnect, reconnect. No model, engine or external service; run.py scrubs every
    # environment and fails the run on any egress. The adapter keeps the pinned SDK; the
    # second server is the release production runs.
    name: server-contract (server ${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: ['0.16.0', '0.19.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install omnigent==0.16.0
      - name: Separate installation for a newer server
        if: matrix.server != '0.16.0'
        env:
          SERVER_VERSION: ${{ matrix.server }}
        run: |
          python -m venv "$RUNNER_TEMP/server"
          "$RUNNER_TEMP/server/bin/python" -m pip install "omnigent==$SERVER_VERSION"
          echo "SERVER_OMNIGENT=$RUNNER_TEMP/server/bin/omnigent" >> "$GITHUB_ENV"
      - name: Server contract
        env:
          SERVER_VERSION: ${{ matrix.server }}
        run: |
          args=(--expect-sdk-version 0.16.0 --expect-server-version "$SERVER_VERSION" --logs "$RUNNER_TEMP/contract-logs")
          if [[ -n "${SERVER_OMNIGENT:-}" ]]; then args+=(--server-omnigent "$SERVER_OMNIGENT"); fi
          python tests/server-contract/run.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: server-contract-${{ matrix.server }}
          path: ${{ runner.temp }}/contract-logs
          retention-days: 14
  native-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Prepare pinned Pi Web with native Omnigent tab
        run: |
          git clone https://github.com/agegr/pi-web.git /tmp/pi-web-omnigent
          git -C /tmp/pi-web-omnigent checkout --detach 6fcd7d44981ab51a21d6cd6eb06d361d0e3d3068
          git -C /tmp/pi-web-omnigent apply "$GITHUB_WORKSPACE/integrations/pi-web/adapter.patch"
      - run: npm ci --ignore-scripts --no-fund
        working-directory: /tmp/pi-web-omnigent
      - run: npm audit --audit-level=high
        working-directory: /tmp/pi-web-omnigent
      - run: node --test lib/omnigent-runtime.test.mjs lib/omnigent-reload.test.mjs lib/settings-navigation.test.mjs lib/i18n/registry.test.mjs app/api/omnigent/route.test.mjs components/SettingsPanel.test.mjs
        working-directory: /tmp/pi-web-omnigent
      - run: npx tsc --noEmit
        working-directory: /tmp/pi-web-omnigent
      - run: npm run build
        working-directory: /tmp/pi-web-omnigent
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CIRCLE_NODE_TOTAL: '3'
      - run: npx playwright install --with-deps chromium
        working-directory: /tmp/pi-web-omnigent
      - name: Settings-only binding and legacy-session regression (production)
        shell: bash
        run: |
          set -o pipefail
          node e2e/omnigent-settings-only.mjs | tee settings-only-browser.json
        working-directory: /tmp/pi-web-omnigent
        env:
          PI_OMNIGENT_TEST_PLUGIN_ROOT: ${{ github.workspace }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: settings-only-native-browser
          path: /tmp/pi-web-omnigent/settings-only-browser.json
          retention-days: 30
  combined-ui:
    name: combined-ui (${{ matrix.paseo.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        paseo:
          - version: '0.1.13'
            ref: 'v0.1.13'
          # The release images bundle; same host/adapter.patch bytes as 0.1.13 (#18).
          - version: '0.1.14'
            ref: 'v0.1.14'
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/paseo-playwright
      PASEO_REF: ${{ matrix.paseo.ref }}
      PASEO_VERSION: ${{ matrix.paseo.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Verify published contributors and combined adapter
        run: |
          git init /tmp/pi-paseo
          git -C /tmp/pi-paseo fetch --depth=1 https://github.com/WOOWTECH/pi-paseo-plugin.git "$PASEO_REF"
          git -C /tmp/pi-paseo checkout --detach FETCH_HEAD
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const sha = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const combined = JSON.parse(fs.readFileSync('integrations/pi-web/combined.adapter-meta.json'));
          const omni = JSON.parse(fs.readFileSync('package.json'));
          const paseo = JSON.parse(fs.readFileSync('/tmp/pi-paseo/package.json'));
          const candidates = [combined.paseo, ...(combined.paseo.compatibleAdapters ?? [])];
          const compatible = candidates.some(candidate =>
            [candidate.packageVersion, ...(candidate.compatiblePackageVersions ?? [])].includes(paseo.version) &&
            candidate.adapterPatchSha256 === sha('/tmp/pi-paseo/host/adapter.patch'));
          if (combined.patchSha256 !== sha('integrations/pi-web/combined.adapter.patch') ||
              combined.omnigent.adapterPatchSha256 !== sha('integrations/pi-web/adapter.patch') ||
              !compatible ||
              combined.omnigent.packageVersion !== omni.version ||
              paseo.version !== process.env.PASEO_VERSION ||
              combined.settingsSections.join(',') !== 'mcp,omnigent,paseo') process.exit(1);
          JS
          git clone https://github.com/agegr/pi-web.git /tmp/pi-web-combined
          git -C /tmp/pi-web-combined checkout --detach 6fcd7d44981ab51a21d6cd6eb06d361d0e3d3068
          git -C /tmp/pi-web-combined apply --check "$GITHUB_WORKSPACE/integrations/pi-web/combined.adapter.patch"
          git -C /tmp/pi-web-combined apply "$GITHUB_WORKSPACE/integrations/pi-web/combined.adapter.patch"
          git -C /tmp/pi-web-combined apply --reverse --check "$GITHUB_WORKSPACE/integrations/pi-web/combined.adapter.patch"
      - run: npm ci --ignore-scripts --no-fund
        working-directory: /tmp/pi-web-combined
      - run: npm audit --audit-level=high --no-fund
        working-directory: /tmp/pi-web-combined
      - run: node --test lib/settings-navigation.test.mjs lib/i18n/registry.test.mjs app/api/plugin-paseo/route.test.mjs app/api/omnigent/route.test.mjs components/PaseoPluginPanel.behavior.test.mjs components/SettingsPanel.test.mjs
        working-directory: /tmp/pi-web-combined
      - name: Actual Paseo display-preference host contract
        if: matrix.paseo.version == '0.1.13'
        run: node --test lib/paseo-name.test.mjs
        working-directory: /tmp/pi-web-combined
        env:
          PI_PASEO_PLUGIN_ROOT: /tmp/pi-paseo
      - run: npx tsc --noEmit
        working-directory: /tmp/pi-web-combined
      - run: npm run build
        working-directory: /tmp/pi-web-combined
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CIRCLE_NODE_TOTAL: '3'

      - name: Real packed-package installer acceptance
        if: matrix.paseo.version == '0.1.13'
        shell: bash
        run: |
          paseo_installer_dir="$RUNNER_TEMP/paseo-installer-package"
          mkdir -p "$paseo_installer_dir"
          npm pack /tmp/pi-paseo --ignore-scripts --pack-destination "$paseo_installer_dir" --json > "$paseo_installer_dir/pack.json"
          tar -xzf "$paseo_installer_dir/woowtech-pi-paseo-${PASEO_VERSION}.tgz" -C "$paseo_installer_dir"
          node tests/combined-package-installer.mjs /tmp/pi-web-combined "$paseo_installer_dir/package" "$RUNNER_TEMP/combined-installer.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.paseo.version == '0.1.13'
        with:
          name: combined-installer-${{ matrix.paseo.version }}
          path: ${{ runner.temp }}/combined-installer.json
          if-no-files-found: error
          retention-days: 30

      - run: npx playwright install --with-deps chromium
        working-directory: /tmp/pi-web-combined
      - name: Mobile and desktop Paseo scroll regression
        run: node e2e/paseo-mobile-scroll-runner.mjs
        working-directory: /tmp/pi-web-combined
        env:
          PI_PASEO_PLUGIN_ROOT: /tmp/pi-paseo
      - name: Settings-only binding and legacy-session regression (production)
        shell: bash
        run: |
          set -o pipefail
          node e2e/omnigent-settings-only.mjs | tee settings-only-browser.json
        working-directory: /tmp/pi-web-combined
        env:
          PI_OMNIGENT_TEST_PLUGIN_ROOT: ${{ github.workspace }}
          PI_PASEO_PLUGIN_ROOT: /tmp/pi-paseo
      - name: Install the Paseo plugin runtime dependencies, as an installed plugin has them
        # The fresh-install test runs the real Paseo route, which loads the plugin's host API; a bare checkout answers 503.
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: /tmp/pi-paseo
        env:
          PI_PASEO_SKIP_POSTINSTALL: '1'
      - name: Fresh install with no conversation (production)
        # A brand-new install has no session and no picked project. Settings > Paseo must load from the server's own
        # fallback directory, the first screen must point at Settings > Omnigent, and the Paseo section must scroll
        # by touch on phones. A directory named by the client must stay refused.
        shell: bash
        run: |
          set -o pipefail
          node e2e/fresh-install-zero-conversation.mjs | tee fresh-install-browser.json
        working-directory: /tmp/pi-web-combined
        env:
          PI_OMNIGENT_TEST_PLUGIN_ROOT: ${{ github.workspace }}
          PI_PASEO_PLUGIN_ROOT: /tmp/pi-paseo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fresh-install-combined-${{ matrix.paseo.version }}-browser
          path: /tmp/pi-web-combined/fresh-install-browser.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: settings-only-combined-${{ matrix.paseo.version }}-browser
          path: /tmp/pi-web-combined/settings-only-browser.json
          retention-days: 30
